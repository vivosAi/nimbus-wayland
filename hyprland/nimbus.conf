# Nimbus for Hyprland, configuration only.
#
#   source = ~/.config/hypr/nimbus.conf
#
# This is the cheap version. Hyprland already draws a border on the focused
# window and can animate its gradient, so most of what the macOS app does by
# hand is available here as config. Try this before installing anything: it may
# be enough, and you will find that out in five minutes.

general {
    border_size = 3

    # Plasma. The palette rotation script rewrites this line's value at runtime.
    col.active_border = rgba(7C4DFFee) rgba(00E5FFee) rgba(536DFEee) 45deg

    # Nothing on unfocused windows. The whole point is that exactly one window
    # is marked, so a second border competing with it defeats the purpose.
    col.inactive_border = rgba(00000000)
}

decoration {
    rounding = 10

    # Stands in for the bloom. Not the shader glow, but it reads as light
    # around the window rather than a line drawn on it.
    shadow {
        enabled = true
        range = 28
        render_power = 3
        color = rgba(536DFE55)
        color_inactive = rgba(00000000)
    }
}

animations {
    enabled = true

    # The ring never stops moving. A static marker works for a week and is
    # invisible by the end of the month: your eye stops seeing what never
    # changes. 60 is roughly one rotation every six seconds, slow enough to
    # read as drifting rather than spinning.
    animation = borderangle, 1, 60, linear, loop

    # Eases the border when focus moves, which is the cheap version of the
    # flare. Hyprland cannot brighten and settle, only transition.
    animation = border, 1, 6, default
}

# Syntax moves between Hyprland releases, particularly the decoration block.
# Check against https://wiki.hyprland.org if something is ignored.
